<section id="analytics-consent" class="analytics-consent" role="region" aria-labelledby="analytics-title" hidden>
  <div class="analytics-copy">
    <h2 id="analytics-title" tabindex="-1">Hilfst du uns, NettoDeals zu verbessern?</h2>
    <p>Mit deiner Zustimmung messen wir mit Google Analytics, welche Seiten besucht werden.
      Dabei werden Daten an Google übertragen und Analyse-Cookies gesetzt.
      Ohne Zustimmung bleibt alles nutzbar. <a href="/datenschutz">Mehr zum Datenschutz</a></p>
  </div>
  <div class="analytics-actions">
    <button type="button" id="analytics-reject">Ohne Analyse weiter</button>
    <button type="button" id="analytics-accept">Analyse erlauben</button>
    <button type="button" id="analytics-close" hidden>Auswahl beibehalten</button>
  </div>
</section>
<div class="analytics-settings">
  <button type="button" id="analytics-settings" hidden aria-controls="analytics-consent" aria-expanded="false">Datenschutz-Einstellungen</button>
</div>
